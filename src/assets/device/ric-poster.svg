<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800" role="img" aria-labelledby="t">
  <title id="t">Temsili RIC işitme cihazı çizimi</title>
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b4048"/>
      <stop offset="0.55" stop-color="#262a30"/>
      <stop offset="1" stop-color="#15181d"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d9dde2"/>
      <stop offset="1" stop-color="#8e949c"/>
    </linearGradient>
    <radialGradient id="dome" cx="0.4" cy="0.35" r="0.8">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#b9c4ca" stop-opacity="0.55"/>
    </radialGradient>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#112b3c" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#112b3c" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <ellipse cx="440" cy="640" rx="230" ry="46" fill="url(#shadow)"/>
  <!-- receiver wire -->
  <path d="M 347 212 C 320 150, 420 105, 490 160 C 560 215, 575 320, 566 405" fill="none" stroke="#c9d0d4" stroke-width="7" stroke-linecap="round"/>
  <path d="M 347 212 C 320 150, 420 105, 490 160 C 560 215, 575 320, 566 405" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
  <!-- body -->
  <path d="M 342 198 C 428 186, 478 252, 462 336 C 450 406, 404 452, 350 442 C 296 432, 276 370, 282 304 C 288 242, 298 204, 342 198 Z" fill="url(#body)"/>
  <path d="M 348 214 C 400 208, 440 250, 436 300 C 434 320, 428 336, 418 346 C 420 300, 396 244, 348 236 Z" fill="#ffffff" fill-opacity="0.09"/>
  <!-- mic ports -->
  <circle cx="392" cy="214" r="5" fill="#0d0f12"/>
  <circle cx="416" cy="228" r="5" fill="#0d0f12"/>
  <!-- button -->
  <rect x="452" y="300" width="14" height="52" rx="7" fill="#0f1215" transform="rotate(-8 459 326)"/>
  <!-- charging contacts -->
  <rect x="330" y="432" width="18" height="6" rx="3" fill="#c9a227"/>
  <rect x="356" y="438" width="18" height="6" rx="3" fill="#c9a227"/>
  <!-- receiver -->
  <rect x="551" y="398" width="30" height="72" rx="15" fill="url(#metal)" transform="rotate(6 566 434)"/>
  <!-- dome -->
  <path d="M 536 468 C 528 508, 552 536, 578 536 C 604 536, 626 508, 616 468 C 604 456, 548 456, 536 468 Z" fill="url(#dome)" stroke="#9aa9b1" stroke-opacity="0.6" stroke-width="2"/>
</svg>
